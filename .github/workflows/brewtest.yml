name: Homebrew Install Test

on:
  push:
    branches: [ trunk ]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  test-brew-install:
    strategy:
      matrix:
        os: [macos-15-intel, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:

      - name: Install Package from Homebrew
        run: |
          brew tap atsign-foundation/homebrew-tap
          # Trust the tap if Homebrew version is 6 or later
          brew_version=$(brew --version 2>/dev/null | head -n 1 | cut -d' ' -f2 | cut -d'.' -f1 || true)
          if [ -n "$brew_version" ] && [ "$brew_version" -ge 6 ] 2>/dev/null; then
            echo "Brew version 6 or later detected ($brew_version). Trusting tap atsign-foundation/homebrew-tap..."
            brew trust atsign-foundation/homebrew-tap
          fi
          brew install noports

      - name: Display Architecture and Version
        run: |
          echo "Currently running on:"
          uname -m
          
          echo "Binary path:"
          which noports
          
          echo "Package version info:"
          sshnp --version

          echo "Installed with brew version:"
          brew --version
